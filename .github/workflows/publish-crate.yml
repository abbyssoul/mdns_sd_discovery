name: Publish Crate package

on:
  release:
    types: [created]
  # Primary trigger: prepare-release.yml dispatches this at the release tag
  # (its GITHUB_TOKEN-created release cannot fire the `release` event above).
  # Also usable manually to re-run a failed publish; dispatch from the tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Check Cargo.toml version matches release tag
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "${{ github.ref_name }}"

      - name: Publish Crate
        run: cargo publish --locked --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
