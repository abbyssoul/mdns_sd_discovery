name: Fuzz

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Monday 03:00 UTC — longer soak run.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to run each fuzz target"
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than floating `nightly`: rustc 1.99.0-nightly (008fa22ce
  # 2026-07-25) ICEs compiling tokio ("not immediate: OperandRef(Uninit ...)",
  # rustc_codegen_ssa mir/operand.rs:291), which fails every target at build
  # time before any fuzzing runs. Upstream rust-lang/rust#159815, fixed by
  # rust-lang/rust#159825 (merged 2026-07-26 06:29 UTC, i.e. after the nightly
  # above was cut) — so the first nightly with the fix is 2026-07-27.
  #
  # TO UNPIN: check that the current nightly builds the fuzz targets
  # (`FUZZ_TOOLCHAIN=nightly scripts/fuzz.sh 5`) and drop this variable and the
  # `toolchain:` input below. Verify rather than assume: rust-lang/rust#159867 is
  # a still-open ICE in the same `OperandValue::Uninit` family.
  #
  # 2026-07-20 is verified to build the fuzz graph and run the targets.
  # `scripts/fuzz.sh` reads this to pick the toolchain it drives cargo-fuzz with.
  FUZZ_TOOLCHAIN: nightly-2026-07-20

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          cache-workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/cache-cargo-install-action@417450f3c33ee20393705369577571770643d4c7
        with:
          tool: cargo-fuzz

      # Restore the newest corpus from earlier runs and save this run's
      # additions under a fresh key, so coverage accumulates across runs
      # instead of restarting from the seed inputs every time.
      - name: Restore accumulated corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Pick duration
        id: dur
        run: |
          case "${{ github.event_name }}" in
            schedule)         echo "seconds=600" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "seconds=${{ github.event.inputs.seconds }}" >> "$GITHUB_OUTPUT" ;;
            *)                echo "seconds=60"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run fuzz targets
        run: scripts/fuzz.sh "${{ steps.dur.outputs.seconds }}"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
